<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s ease-in-out;
            cursor: pointer;
        }

        .card.open {
            transform: rotateY(-160deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card-front {
            background: #fff;
            color: #d63384;
            border: 5px solid #ff4d6d;
        }

        .card-front h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card-front p {
            font-size: 14px;
            color: #666;
        }

        .card-back {
            background: #fff0f3;
            color: #333;
            transform: rotateY(180deg);
            border: 2px dashed #ff758c;
        }

        .card-back h2 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .card-back p {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 14px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card" id="card" onclick="toggleCard()">
            <!-- Mặt trước thiệp -->
            <div class="card-face card-front">
                <h1>🌸 Chúc Mừng 20/10 🌸</h1>
                <p>Gửi đến một nửa thế giới yêu thương...</p>
                <p style="margin-top: 40px; font-weight: bold; color: #ff4d6d;">(Chạm để mở thiệp)</p>
            </div>
            <!-- Mặt trong thiệp -->
            <div class="card-face card-back">
                <h2>Chúc Mừng Ngày 20/10!</h2>
                <p>Chúc em luôn luôn vui vẻ, hạnh phúc, xinh đẹp và ngập tràn tiếng cười trong cuộc sống. Mong mọi điều tốt đẹp nhất sẽ đến với em! ❤️</p>
            </div>
        </div>
    </div>

    <div class="hint">Nhấp vào thiệp để mở/đóng</div>

    <script>
        function toggleCard() {
            const card = document.getElementById('card');
            card.classList.toggle('open');
        }
    </script>

</body>
</html>
